services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the static bundle at build time (see Dockerfile).
        - VITE_PUBLIC_SUPABASE_URL=${VITE_PUBLIC_SUPABASE_URL}
        - VITE_PUBLIC_SUPABASE_ANON_KEY=${VITE_PUBLIC_SUPABASE_ANON_KEY}
    ports:
      - '${PORT:-3000}:80'
    environment:
      - PUBLIC_POSTHOG_HOST=${PUBLIC_POSTHOG_HOST:-https://eu.i.posthog.com}
      - PUBLIC_POSTHOG_PROJECT_TOKEN=${PUBLIC_POSTHOG_PROJECT_TOKEN:-}
      - ORIGIN=${ORIGIN:-http://localhost:3000}
    labels:
      - traefik.enable=true
      - traefik.http.routers.tilt.rule=Host(`tilt.159.223.26.67.sslip.io`)
      - traefik.http.routers.tilt.entrypoints=http
      - traefik.http.routers.tilt-https.rule=Host(`tilt.159.223.26.67.sslip.io`)
      - traefik.http.routers.tilt-https.entrypoints=https
      - traefik.http.routers.tilt-https.tls=true
      - traefik.http.routers.tilt-https.tls.certresolver=letsencrypt
      - traefik.http.services.tilt.loadbalancer.server.port=80
    restart: unless-stopped
    networks:
      - coolify

networks:
  coolify:
    external: true
