name: PR Gate

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for iCloud conflict files
        run: |
          CONFLICTS=$(find . -name ".!*sync_conflict*" -o -name "* Conflict*" 2>/dev/null)
          if [ -n "$CONFLICTS" ]; then
            echo "::error::iCloud conflict files detected:$CONFLICTS"
            exit 1
          fi

  node-quality:
    name: Node Quality
    runs-on: ubuntu-latest
    needs: repo-hygiene
    env:
      PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.PUBLIC_POSTHOG_PROJECT_TOKEN }}
      PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run check
      - name: Test with coverage
        run: pnpm run test:coverage
      - name: Build
        run: pnpm run build

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: repo-hygiene
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: sonarsource/sonarcloud-github-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectKey: Jonathangadeaharder_Poker
          organization: jonathangadeaharder

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    needs: repo-hygiene
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    needs: repo-hygiene
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e-critical:
    name: E2E Critical
    runs-on: ubuntu-latest
    needs: node-quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run critical E2E tests
        run: pnpm exec playwright test --grep @critical

  infra-validation:
    name: Infra Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          echo "Checking docker-compose.yml exists..."
          test -f docker-compose.yml || { echo "::error::docker-compose.yml missing"; exit 1; }
          echo "Checking ORIGIN env var is present..."
          grep -q 'ORIGIN=' docker-compose.yml || { echo "::error::docker-compose.yml missing ORIGIN env var"; exit 1; }
          echo "Checking Traefik TLS labels present..."
          grep -q 'tls.certresolver=letsencrypt' docker-compose.yml || { echo "::error::docker-compose.yml missing TLS certresolver label"; exit 1; }
          echo "Checking HEALTHCHECK in Dockerfile..."
          test -f Dockerfile || echo "::warning::No Dockerfile found"
          if [ -f Dockerfile ]; then
            grep -q 'HEALTHCHECK' Dockerfile || { echo "::error::Dockerfile missing HEALTHCHECK instruction"; exit 1; }
          fi
          echo "All infra checks passed."

      - name: Validate env var defaults
        run: |
          echo "Checking PostHog host is EU region..."
          if grep -q 'us.posthog.com' docker-compose.yml 2>/dev/null; then
            echo "::error::docker-compose.yml has wrong PostHog host (us, should be eu)"
            exit 1
          fi
          echo "PostHog host check passed."

  required-checks:
    name: Required Checks (PR)
    runs-on: ubuntu-latest
    needs:
      - repo-hygiene
      - node-quality
      - sonarcloud
      - dependency-scan
      - secret-scanning
      - e2e-critical
      - infra-validation
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.repo-hygiene.result }}" == "failure" || \
                "${{ needs.node-quality.result }}" == "failure" || \
                "${{ needs.sonarcloud.result }}" == "failure" || \
                "${{ needs.dependency-scan.result }}" == "failure" || \
                "${{ needs.secret-scanning.result }}" == "failure" || \
                "${{ needs.e2e-critical.result }}" == "failure" || \
                "${{ needs.infra-validation.result }}" == "failure" ]]; then
            echo "::error::One or more required checks failed"
            exit 1
          fi
          echo "All required checks passed"
