name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to deploy'
        required: true
        type: choice
        options:
          - android
          - ios
          - both

jobs:
  # Validate before deployment
  validate:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run all tests
        run: npm test -- --watchAll=false

      - name: Run linter
        run: npm run lint || true

      - name: Security audit
        run: npm audit --audit-level=high || true

  # Deploy to Android (Google Play)
  deploy-android:
    name: Deploy Android
    runs-on: ubuntu-latest
    needs: validate
    if: github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        run: npm install -g eas-cli

      - name: Build Android Production
        run: |
          echo "Building Android production APK/AAB..."
          # eas build --platform android --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Submit to Google Play
        run: |
          echo "Submitting to Google Play..."
          # eas submit --platform android --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}

  # Deploy to iOS (App Store)
  deploy-ios:
    name: Deploy iOS
    runs-on: macos-latest
    needs: validate
    if: github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        run: npm install -g eas-cli

      - name: Build iOS Production
        run: |
          echo "Building iOS production IPA..."
          # eas build --platform ios --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Submit to App Store
        run: |
          echo "Submitting to App Store..."
          # eas submit --platform ios --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

  # Create GitHub Release
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [deploy-android, deploy-ios]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            ## What's Changed
            - See [CHANGELOG.md](CHANGELOG.md) for details

            ## Downloads
            - **Android**: Available on Google Play
            - **iOS**: Available on App Store
          draft: false
          prerelease: false

  # Notify team
  notify-deployment:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-android, deploy-ios]
    if: always()

    steps:
      - name: Deployment Status
        run: |
          echo "Deployment Status: ${{ job.status }}"
          echo "Android: ${{ needs.deploy-android.result }}"
          echo "iOS: ${{ needs.deploy-ios.result }}"

      # Add Slack/Discord notification here
      - name: Send notification
        run: |
          echo "Sending deployment notification..."
          # curl -X POST -H 'Content-type: application/json' \
          # --data '{"text":"Deployment completed!"}' \
          # ${{ secrets.SLACK_WEBHOOK_URL }}
