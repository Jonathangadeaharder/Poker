# structurelint configuration for Poker Training App
# React Native / Expo project structure enforcement

root: true

rules:
  # Limit directory nesting depth to keep structure flat and manageable
  max-depth: { max: 4 }

  # Prevent any directory from having too many files
  max-files-in-dir: { max: 25 }

  # Limit number of subdirectories to maintain organization
  max-subdirs: { max: 15 }

  # Naming conventions using glob patterns
  naming-convention:
    # Components should use PascalCase
    "src/components/**/*.js": "PascalCase"
    # Screens should use PascalCase
    "src/screens/**/*.js": "PascalCase"
    # Hooks should use camelCase (enforced via regex-match for 'use' prefix)
    "src/hooks/**/*.js": "camelCase"
    # Utils should use camelCase
    "src/utils/**/*.js": "camelCase"
    # Services should use camelCase
    "src/services/**/*.js": "camelCase"
    # Context files should use PascalCase
    "src/context/**/*.js": "PascalCase"
    # Core logic files should use camelCase
    "src/core/**/*.js": "camelCase"
    # Data files should use camelCase
    "src/data/**/*.js": "camelCase"
    # Test files should use camelCase
    "__tests__/**/*.js": "camelCase"

  # Disallow common problematic patterns
  disallowed-patterns:
    - "**/*.tmp"
    - "**/*.backup"
    - "**/TODO.txt"
    - "**/.DS_Store"

# Ignore patterns (similar to .gitignore)
exclude:
  - node_modules/**
  - .git/**
  - .expo/**
  - .expo-shared/**
  - dist/**
  - build/**
  - coverage/**
  - "*.log"

overrides:
  # Hooks must start with 'use'
  - files: ['src/hooks/**/*.js']
    rules:
      regex-match:
        "src/hooks/*.js": "regex:^use[A-Z].*\\.js$"

  # Context files must end with 'Context'
  - files: ['src/context/**/*.js']
    rules:
      regex-match:
        "src/context/*.js": "regex:.*Context\\.js$"

  # Test files must end with '.test.js'
  - files: ['__tests__/**/*.js']
    rules:
      regex-match:
        "__tests__/*.test.js": "regex:.*\\.test\\.js$"

  # Documentation should use SCREAMING_SNAKE_CASE
  - files: ['docs/**/*.md']
    rules:
      naming-convention:
        "docs/**/*.md": "SCREAMING_SNAKE_CASE"

  # Root level configuration and documentation
  - files: ['*.{js,json,md}']
    rules:
      max-files-in-dir: { max: 20 }
