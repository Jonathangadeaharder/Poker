# structurelint configuration for Poker Training App
# React Native / Expo - COMPREHENSIVE ENFORCEMENT
# All 6 phases enabled (0, 1, 2, 3, 5, 8)

root: true

# ============================================================================
# Entrypoints (Phase 2: files that don't need to be imported)
# ============================================================================

entrypoints:
  - "App.js"
  - "babel.config.js"
  - "app.json"
  - "**/*.test.js"
  - "**/*.spec.js"
  - "__tests__/**"

# ============================================================================
# Phase 1: Architectural Layer Enforcement
# ============================================================================

layers:
  # Data layer - Static configuration and constants
  - name: 'data'
    path: 'src/data/**'
    dependsOn: []

  # Core layer - Business logic and algorithms
  - name: 'core'
    path: 'src/core/**'
    dependsOn: []

  # Utils layer - Pure utility functions
  - name: 'utils'
    path: 'src/utils/**'
    dependsOn: []

  # Services layer - API and external integrations
  - name: 'services'
    path: 'src/services/**'
    dependsOn: ['utils']

  # Context layer - State management
  - name: 'context'
    path: 'src/context/**'
    dependsOn: ['services', 'core', 'utils']

  # Hooks layer - React hooks
  - name: 'hooks'
    path: 'src/hooks/**'
    dependsOn: ['services', 'context', 'core', 'utils']

  # Components layer - Reusable UI components
  # Pragmatic: can import core/services for gamification and error tracking
  - name: 'components'
    path: 'src/components/**'
    dependsOn: ['hooks', 'context', 'core', 'services', 'utils']

  # Screens layer - Top-level screens (can import from all)
  - name: 'screens'
    path: 'src/screens/**'
    dependsOn: ['components', 'hooks', 'context', 'services', 'core', 'data', 'utils']

# ============================================================================
# Rules
# ============================================================================

rules:
  # --------------------------------------------------------------------------
  # Phase 0: Project Structure Rules
  # --------------------------------------------------------------------------

  max-depth: { max: 5 }
  max-files-in-dir: { max: 15 }
  max-subdirs: { max: 10 }

  naming-convention:
    "src/components/**/*.js": "PascalCase"
    "src/screens/**/*.js": "PascalCase"
    "src/hooks/**/*.js": "camelCase"
    "src/utils/**/*.js": "camelCase"
    "src/services/**/*.js": "camelCase"
    "src/context/**/*.js": "PascalCase"
    "src/core/**/*.js": "camelCase"
    "src/data/**/*.js": "camelCase"
    "__tests__/**/*.js": "camelCase"
    "docs/**/*.md": "SCREAMING_SNAKE_CASE"

  disallowed-patterns:
    - "**/*.tmp"
    - "**/*.backup"
    - "**/TODO.txt"
    - "**/.DS_Store"
    - "**/*.swp"

  # --------------------------------------------------------------------------
  # Phase 1: Architectural Layer Enforcement
  # --------------------------------------------------------------------------

  enforce-layer-boundaries: true

  # --------------------------------------------------------------------------
  # Phase 2: Dead Code Detection (ENABLED with pragmatic exemptions)
  # --------------------------------------------------------------------------

  disallow-orphaned-files: true
  disallow-unused-exports: true

  # --------------------------------------------------------------------------
  # Phase 3: Test Validation
  # --------------------------------------------------------------------------

  test-adjacency:
    pattern: "adjacent"
    file-patterns:
      - "src/**/*.js"
    exemptions:
      - "src/data/**/*.js"
      - "src/screens/**/*.js"
      - "src/components/EmptyState.js"
      - "src/components/ErrorMessage.js"
      - "src/components/LoadingSpinner.js"
      - "src/components/StreakFlame.js"
      - "src/components/XPBar.js"
      - "src/components/ErrorBoundary.js"
      - "src/components/AchievementBadge.js"
      - "**/*.test.js"
      - "**/*.spec.js"
      - "**/__tests__/**"

  test-location:
    integration-test-dir: "__tests__"
    allow-adjacent: true
    file-patterns:
      - "**/*.test.js"
      - "**/*.spec.js"
    exemptions:
      - "node_modules/**"

  # --------------------------------------------------------------------------
  # Phase 5: Evidence-Based Complexity Metrics
  # --------------------------------------------------------------------------

  max-cognitive-complexity:
    max: 15
    file-patterns:
      - "**/*.js"
      - "**/*.jsx"

  max-halstead-effort:
    max: 100000
    file-patterns:
      - "**/*.js"
      - "**/*.jsx"

  # --------------------------------------------------------------------------
  # Phase 8: GitHub Workflow Enforcement
  # --------------------------------------------------------------------------

  github-workflows:
    require-tests: true
    require-quality: true
    required-triggers:
      - pull_request
      - push

# ============================================================================
# Overrides for Specific Directories
# ============================================================================

overrides:
  # Screens - used by React Navigation, not directly imported
  - files: ['src/screens/**']
    rules:
      max-files-in-dir: { max: 20 }
      max-cognitive-complexity: { max: 20 }
      max-halstead-effort: { max: 150000 }
      disallow-orphaned-files: 0
      disallow-unused-exports: 0

  # Data directory - static data files
  - files: ['src/data/**']
    rules:
      disallow-orphaned-files: 0
      disallow-unused-exports: 0

  # Generic UI components - reusable but may not be used yet
  - files: ['src/components/EmptyState.js', 'src/components/ErrorMessage.js']
    rules:
      disallow-orphaned-files: 0
      disallow-unused-exports: 0

  # Test files - relaxed rules
  - files: ['**/*.test.js', '**/*.spec.js', '__tests__/**']
    rules:
      max-cognitive-complexity: { max: 25 }
      max-halstead-effort: { max: 150000 }
      disallow-orphaned-files: 0
      disallow-unused-exports: 0
      naming-convention: 0

  # Entry points - exported for external use
  - files: ['App.js', 'src/index.js', 'app.json', 'babel.config.js']
    rules:
      disallow-unused-exports: 0
      disallow-orphaned-files: 0

  # Hooks must start with 'use'
  - files: ['src/hooks/**/*.js']
    rules:
      regex-match:
        "src/hooks/*.js": "regex:^use[A-Z].*\\.js$"

  # Context files must end with 'Context'
  - files: ['src/context/**/*.js']
    rules:
      regex-match:
        "src/context/*.js": "regex:.*Context\\.js$"

  # Test files must match pattern
  - files: ['__tests__/**/*.js', 'src/**/*.test.js', 'src/**/*.spec.js']
    rules:
      regex-match:
        "**/*.test.js": "regex:.*\\.test\\.js$"
        "**/*.spec.js": "regex:.*\\.spec\\.js$"

  # Documentation
  - files: ['docs/**']
    rules:
      max-files-in-dir: { max: 20 }
      max-depth: { max: 3 }

  # Root level
  - files: ['*.{js,json,md}']
    rules:
      max-files-in-dir: { max: 25 }

# ============================================================================
# Ignore Patterns
# ============================================================================

exclude:
  - node_modules/**
  - .git/**
  - .expo/**
  - .expo-shared/**
  - dist/**
  - build/**
  - coverage/**
  - "*.log"
