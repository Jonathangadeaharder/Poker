# structurelint configuration for Poker Training App
# React Native / Expo project - Pragmatic enforcement with best practices

root: true

# ============================================================================
# Entrypoints (files that don't need to be imported)
# ============================================================================

entrypoints:
  - "App.js"
  - "babel.config.js"
  - "app.json"
  - "**/*.test.js"
  - "**/*.spec.js"
  - "__tests__/**"

# ============================================================================
# Rules
# ============================================================================

rules:
  # --------------------------------------------------------------------------
  # Evidence-Based Complexity Metrics (Phase 5)
  # --------------------------------------------------------------------------

  max-cognitive-complexity:
    max: 15
    file-patterns:
      - "**/*.js"
      - "**/*.jsx"

  max-halstead-effort:
    max: 100000
    file-patterns:
      - "**/*.js"
      - "**/*.jsx"

  # --------------------------------------------------------------------------
  # Project Structure Rules (Phase 0)
  # --------------------------------------------------------------------------

  max-depth: { max: 5 }
  max-files-in-dir: { max: 15 }
  max-subdirs: { max: 10 }

  naming-convention:
    "src/components/**/*.js": "PascalCase"
    "src/screens/**/*.js": "PascalCase"
    "src/hooks/**/*.js": "camelCase"
    "src/utils/**/*.js": "camelCase"
    "src/services/**/*.js": "camelCase"
    "src/context/**/*.js": "PascalCase"
    "src/core/**/*.js": "camelCase"
    "src/data/**/*.js": "camelCase"
    "__tests__/**/*.js": "camelCase"

  disallowed-patterns:
    - "**/*.tmp"
    - "**/*.backup"
    - "**/TODO.txt"
    - "**/.DS_Store"
    - "**/*.swp"

  # --------------------------------------------------------------------------
  # Test Validation (Phase 3) - Pragmatic approach
  # --------------------------------------------------------------------------

  test-adjacency:
    pattern: "adjacent"
    file-patterns:
      - "src/**/*.js"
    exemptions:
      # Data files don't need tests
      - "src/data/**/*.js"
      # Screens are integration-heavy, tested via E2E
      - "src/screens/**/*.js"
      # Simple UI components can be visually tested
      - "src/components/EmptyState.js"
      - "src/components/ErrorMessage.js"
      - "src/components/LoadingSpinner.js"
      - "src/components/StreakFlame.js"
      - "src/components/XPBar.js"
      - "src/components/ErrorBoundary.js"
      - "src/components/AchievementBadge.js"
      # Test infrastructure
      - "**/*.test.js"
      - "**/*.spec.js"
      - "**/__tests__/**"

  test-location:
    integration-test-dir: "__tests__"
    allow-adjacent: true
    file-patterns:
      - "**/*.test.js"
      - "**/*.spec.js"

  # --------------------------------------------------------------------------
  # Dead Code Detection (Phase 2) - Disabled for now
  # Re-enable after cleaning up unused code
  # --------------------------------------------------------------------------

  disallow-orphaned-files: 0
  disallow-unused-exports: 0

# ============================================================================
# Overrides for Specific Directories
# ============================================================================

overrides:
  # Screens directory - allow more files, exempt from testing
  - files: ['src/screens/**']
    rules:
      max-files-in-dir: { max: 20 }

  # Data directory
  - files: ['src/data/**']
    rules:
      disallow-orphaned-files: 0
      disallow-unused-exports: 0

  # Test files
  - files: ['**/*.test.js', '**/*.spec.js', '__tests__/**']
    rules:
      max-cognitive-complexity: { max: 25 }
      max-halstead-effort: { max: 150000 }

  # Entry points
  - files: ['App.js', 'src/index.js', 'app.json']
    rules:
      disallow-unused-exports: 0

  # Hooks must start with 'use'
  - files: ['src/hooks/**/*.js']
    rules:
      regex-match:
        "src/hooks/*.js": "regex:^use[A-Z].*\\.js$"

  # Context files must end with 'Context'
  - files: ['src/context/**/*.js']
    rules:
      regex-match:
        "src/context/*.js": "regex:.*Context\\.js$"

  # Documentation
  - files: ['docs/**/*.md']
    rules:
      naming-convention:
        "docs/**/*.md": "SCREAMING_SNAKE_CASE"
      max-files-in-dir: { max: 20 }

  # Root level
  - files: ['*.{js,json,md}']
    rules:
      max-files-in-dir: { max: 25 }

# ============================================================================
# Ignore Patterns
# ============================================================================

exclude:
  - node_modules/**
  - .git/**
  - .expo/**
  - .expo-shared/**
  - dist/**
  - build/**
  - coverage/**
  - "*.log"
  - .github/**
