<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tilt — Poker training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<style>
  html, body { height: 100%; }
  body { background: #07140e; display: grid; place-items: center; }
  #root { width: 100%; height: 100%; }
  .stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 16px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="screens/onboarding.jsx"></script>
<script type="text/babel" src="screens/home.jsx"></script>
<script type="text/babel" src="screens/lesson.jsx"></script>
<script type="text/babel" src="screens/results.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "screen": "onboarding",
  "cardStyle": "classic",
  "theme": "felt",
  "density": "cozy",
  "gamificationLoudness": "balanced",
  "homeLayout": "stacked",
  "typography": "serif-display"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [screen, setScreen] = useState(tweaks.screen || 'onboarding');
  const [picks, setPicks] = useState(null);

  useEffect(() => { setScreen(tweaks.screen); }, [tweaks.screen]);

  // Theme application
  useEffect(() => {
    const root = document.documentElement;
    const themes = {
      felt:    { felt: '#0e2a20', felt2: '#143628', felt3: '#1d4a36', cream: '#f5e9d4', coral: '#ff5b48', gold: '#e9b949' },
      midnight:{ felt: '#0a0e27', felt2: '#141a3a', felt3: '#1d2752', cream: '#e8eaff', coral: '#a78bfa', gold: '#22d3ee' },
      clay:    { felt: '#2a1810', felt2: '#3a2418', felt3: '#4a3020', cream: '#f4ede0', coral: '#ff7849', gold: '#e9b949' },
      paper:   { felt: '#f4ede0', felt2: '#ede4d2', felt3: '#e2d5b8', cream: '#1a1a1a', coral: '#dc2626', gold: '#b8860b' },
    };
    const t = themes[tweaks.theme] || themes.felt;
    root.style.setProperty('--felt', t.felt);
    root.style.setProperty('--felt-2', t.felt2);
    root.style.setProperty('--felt-3', t.felt3);
    root.style.setProperty('--cream', t.cream);
    root.style.setProperty('--coral', t.coral);
    root.style.setProperty('--gold', t.gold);
  }, [tweaks.theme]);

  const goto = (s) => { setScreen(s); setTweak('screen', s); };

  let content;
  if (screen === 'onboarding') content = <OnboardingScreen tweaks={tweaks} onDone={(p) => { setPicks(p); goto('home'); }} />;
  else if (screen === 'home') content = <HomeScreen tweaks={tweaks} picks={picks} onLesson={() => goto('lesson')} />;
  else if (screen === 'lesson') content = <LessonScreen tweaks={tweaks} onBack={() => goto('home')} onComplete={() => goto('results')} />;
  else if (screen === 'results') content = <ResultsScreen tweaks={tweaks} onHome={() => goto('home')} onDone={() => goto('home')} />;

  return (
    <div className="stage">
      <IOSDevice statusBarStyle="light">
        {content}
      </IOSDevice>
      <TweaksPanel title="Tweaks">
        <TweakSection title="Flow">
          <TweakSelect label="Screen" value={tweaks.screen} options={[
            { value: 'onboarding', label: 'Onboarding' },
            { value: 'home', label: 'Home' },
            { value: 'lesson', label: 'Lesson' },
            { value: 'results', label: 'Results' },
          ]} onChange={v => setTweak('screen', v)} />
        </TweakSection>
        <TweakSection title="Theme">
          <TweakRadio label="Color" value={tweaks.theme} options={[
            { value: 'felt', label: 'Felt' },
            { value: 'midnight', label: 'Midnight' },
            { value: 'clay', label: 'Clay' },
            { value: 'paper', label: 'Paper' },
          ]} onChange={v => setTweak('theme', v)} />
          <TweakRadio label="Cards" value={tweaks.cardStyle} options={[
            { value: 'classic', label: 'Classic' },
            { value: 'minimal', label: 'Minimal' },
            { value: 'luxury', label: 'Luxury' },
          ]} onChange={v => setTweak('cardStyle', v)} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
