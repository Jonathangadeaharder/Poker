server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA shell fallback: serve the prerendered shell with a 200 for any
    # non-asset path so deep links / refreshes (e.g. /Tilt/results/<id>)
    # resolve client-side instead of returning a 404 page.
    location /Tilt/ {
        try_files $uri $uri/ /Tilt/200.html;
    }

    location / {
        try_files $uri $uri/ /200.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
}
